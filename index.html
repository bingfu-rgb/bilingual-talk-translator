<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>双向对话翻译 · Talk Translator</title>
<style>
  :root{
    --bg:#0f172a; --panel:#111c33; --panel2:#16233f; --line:#243352;
    --a:#2563eb; --b:#0d9488; --text:#e6edf7; --muted:#93a4c3;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --chip:#1e2c49;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 14px; border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  header .title{font-size:16px; font-weight:700; letter-spacing:.3px;}
  header .title small{display:block;font-size:11px;color:var(--muted);font-weight:400;}
  .ver{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--line);border-radius:999px;font-size:10px;color:var(--muted);vertical-align:middle;}
  .iconbtn{
    background:var(--chip); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:8px 10px; font-size:13px; cursor:pointer;
  }
  .statusbar{
    flex:0 0 auto; padding:6px 14px; font-size:12px; color:var(--muted);
    background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:6px; min-height:30px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto;}
  .dot.ok{background:var(--ok);} .dot.warn{background:var(--warn);} .dot.err{background:var(--err);} .dot.live{background:var(--a);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  main{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}
  .side{
    flex:1 1 50%; display:flex; flex-direction:column; min-height:0; padding:12px; gap:10px;
  }
  .side.top{background:var(--panel); border-bottom:1px solid var(--line);}
  .side.bottom{background:var(--panel); transform:none;}
  .langrow{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
  .lang{
    font-size:13px; font-weight:700; padding:6px 12px; border-radius:999px; color:#fff;
  }
  .top .lang{background:var(--a);} .bottom .lang{background:var(--b);}
  select.langSel{
    -webkit-appearance:none; appearance:none; border:none; cursor:pointer;
    padding-right:10px; max-width:62%;
  }
  select.langSel option{color:#0f172a; background:#fff;}
  .swapbtn{margin-left:auto;}
  .src{
    flex:0 0 auto; min-height:34px; font-size:15px; color:var(--muted);
    background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    white-space:pre-wrap; word-break:break-word; max-height:22vh; overflow:auto;
  }
  .src.empty{color:#5b6c8c;}
  .dst{
    flex:1 1 auto; font-size:22px; font-weight:600; line-height:1.35;
    background:linear-gradient(0deg,var(--panel2),var(--panel2)); border:1px solid var(--line);
    border-radius:14px; padding:12px; white-space:pre-wrap; word-break:break-word; overflow:auto;
  }
  .dst.empty{color:#5b6c8c; font-weight:400; font-size:16px;}
  .controls{display:flex; gap:10px; align-items:stretch; flex:0 0 auto;}
  .typebox{flex:1 1 auto; display:flex; gap:8px;}
  input.txt{
    flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:10px 12px; font-size:15px; min-width:0;
  }
  .btn{
    border:none; border-radius:12px; color:#fff; font-size:15px; font-weight:600;
    padding:0 16px; cursor:pointer; min-height:46px; display:flex; align-items:center; gap:6px;
  }
  .btn:active{transform:scale(.97);}
  .mic{width:54px; padding:0; font-size:22px;}
  .top .mic{background:var(--a);} .bottom .mic{background:var(--b);}
  .mic.recording{background:var(--err); animation:pulse 1s infinite;}
  .send{background:#334155;}
  .read{background:#334155;padding:0 12px;font-size:20px;}
  .read.playing{background:var(--a);}
  .hint{font-size:11px;color:var(--muted);flex:0 0 auto;}

  footer{flex:0 0 auto; padding:8px 14px; border-top:1px solid var(--line); background:var(--bg);}
  .logtoggle{font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;text-align:left;}
  .logbar{display:flex; align-items:center; gap:10px;}
  .logbar .logtoggle{flex:1 1 auto;}
  .mini{background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;flex:0 0 auto;}
  .log{display:none; max-height:26vh; overflow:auto; font-size:13px; margin-top:8px;}
  .log.open{display:block;}
  .logfilter{display:none; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;}
  .logfilter.open{display:flex;}
  .logfilter input{flex:1 1 140px; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 9px; font-size:13px; min-width:0;}
  .logfilter select{flex:0 1 auto; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 9px; font-size:13px; max-width:52%;}
  .log .row{padding:8px 0; border-bottom:1px solid var(--line);}
  .log .row .rowhead{display:flex; align-items:center; gap:8px;}
  .log .row .who{font-size:11px;color:var(--muted);flex:1 1 auto;}
  .log .row .t{margin-top:4px; word-break:break-word;}
  .log .row .tr{margin-top:4px; color:#9fd0ff; word-break:break-word;}
  .rowread{margin-left:8px; background:var(--chip); color:#fff; border:1px solid var(--line); border-radius:8px; padding:2px 9px; font-size:14px; cursor:pointer; vertical-align:middle;}
  .rowread.playing{background:var(--a);}
  .rowdel{background:none; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:2px 8px; font-size:12px; cursor:pointer;}
  .rowdel:hover{color:var(--err); border-color:var(--err);}

  .modal{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:50;}
  .modal.open{display:flex;}
  .sheet{
    background:var(--panel); width:100%; border-radius:16px 16px 0 0; padding:16px;
    border-top:1px solid var(--line); max-height:86dvh; overflow:auto;
  }
  .sheet h3{margin:0 0 4px;font-size:16px;}
  .field{margin:14px 0;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field select,.field input{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:10px; font-size:15px;
  }
  .rowflex{display:flex; gap:10px;}
  .rowflex>*{flex:1;}
  .note{font-size:12px;color:var(--warn);line-height:1.5;}
  .sheet .btn{width:100%; justify-content:center; margin-top:8px;}
  .close{position:sticky;top:0;float:right;background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;}

  /* 面对面模式：下方内容旋转180度 */
  body.face .bottom .langrow,
  body.face .bottom .src,
  body.face .bottom .dst,
  body.face .bottom .controls{transform:rotate(180deg);}
  body.face .bottom .controls input.txt{text-align:right;}
</style>
</head>
<body>
  <header>
    <div class="title">双向对话翻译
      <small>多语种互译 · 选两侧语言，说话或输入<span class="ver" id="verTag"></span></small>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="iconbtn" id="faceBtn">面对面</button>
      <button class="iconbtn" id="settingsBtn">设置</button>
    </div>
  </header>

  <div class="statusbar"><span class="dot" id="statusDot"></span><span id="statusText">准备就绪</span></div>

  <main>
    <!-- A 侧：上方 -->
    <section class="side top" data-side="A">
      <div class="langrow">
        <select class="lang langSel" id="langSelA"></select>
        <button class="iconbtn swapbtn" id="swapAB" style="font-size:12px;">⇅ 交换语言</button>
      </div>
      <div class="src empty" id="srcA">中文 → English</div>
      <div class="dst empty" id="dstA">A 侧译文将显示在这里</div>
      <div class="controls">
        <button class="btn mic" id="micA" title="按住说话">🎤</button>
        <div class="typebox">
          <input class="txt" id="inA" placeholder="也可以直接输入文字…" autocomplete="off" />
          <button class="btn send" data-send="A">译</button>
        </div>
        <button class="btn read" id="readA" title="朗读译文">🔊</button>
      </div>
    </section>

    <!-- B 侧：下方 -->
    <section class="side bottom" data-side="B">
      <div class="langrow">
        <select class="lang langSel" id="langSelB"></select>
      </div>
      <div class="src empty" id="srcB">English → 中文</div>
      <div class="dst empty" id="dstB">B 侧译文将显示在这里</div>
      <div class="controls">
        <button class="btn mic" id="micB" title="Hold to speak">🎤</button>
        <div class="typebox">
          <input class="txt" id="inB" placeholder="Type here…" autocomplete="off" />
          <button class="btn send" data-send="B">译</button>
        </div>
        <button class="btn read" id="readB" title="Read aloud">🔊</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="logbar">
      <button class="logtoggle" id="logToggle">▸ 对话记录（0 条 · 最多1000）</button>
      <button class="mini" id="exportBtn">导出TXT</button>
      <button class="mini" id="exportCsvBtn">导出CSV</button>
      <button class="mini" id="importBtn">导入CSV</button>
      <input type="file" id="importFile" accept=".csv,.txt,text/csv" style="display:none;">
    </div>
    <div class="logfilter" id="logFilter">
      <input type="search" id="searchBox" placeholder="搜索原文/译文…" autocomplete="off" />
      <select id="pairFilter"><option value="">全部语言对</option></select>
      <button class="mini" id="clearFilterBtn">清除筛选</button>
    </div>
    <div class="log" id="log"></div>
  </footer>

  <!-- 设置 -->
  <div class="modal" id="settings">
    <div class="sheet">
      <button class="close" id="settingsClose">关闭</button>
      <h3>设置</h3>
      <p class="note">在华为（无谷歌服务）手机上，浏览器语音识别常不可用，会自动提示；届时请改用输入框打字翻译。翻译引擎可先用免费接口，若你有密钥可填入更稳定。</p>

      <p class="note">语言请直接点上方两侧的彩色下拉框选择，任意两种语言可互译；点 "⇅ 交换语言" 可互换。</p>

      <div class="field">
        <label>翻译引擎</label>
        <select id="setEngine">
          <option value="azure">Azure 翻译（推荐，支持全部语种，需密钥）</option>
          <option value="mymemory">免费接口 MyMemory（无需密钥，仅中英可靠）</option>
        </select>
      </div>
      <div class="field" id="azureFields" style="display:none;">
        <label>Azure 密钥 (Subscription Key)</label>
        <input id="setAzureKey" placeholder="粘贴你的 Azure Translator Key" />
        <div style="height:8px"></div>
        <label>Azure 区域 (Region)，全球资源可填 global</label>
        <input id="setAzureRegion" placeholder="例如 eastasia / global" />
        <div style="height:8px"></div>
        <label>接口地址（一般不用改）</label>
        <input id="setAzureEndpoint" placeholder="https://api.cognitive.microsofttranslator.com" />
        <p class="note">在微软 Azure 搜索创建 “Translator / 翻译资源” 即可拿到 Key 和区域；免费 F0 层每月约 200 万字符。</p>
      </div>

      <div class="field">
        <label>朗读译文（语音合成）</label>
        <select id="setSpeak">
          <option value="on">开启</option>
          <option value="off">关闭</option>
        </select>
      </div>

      <div class="rowflex">
        <button class="btn" id="saveSettings" style="background:var(--a);">保存</button>
        <button class="btn" id="clearLog" style="background:#334155;">清空记录</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/sql-wasm.js"></script>
<script>
(function(){
  "use strict";
  // 版本号 V0.0.1。更新规则：每次更新给最后一段 +1；最后两段各自最大到 999，
  // 某段达到 999 后再 +1 就归零并向左进 1（如 V0.0.999 → V0.1.0；V0.999.999 → V1.0.0）。
  var APP_VERSION = "V0.0.1";
  var LS = "talk_translator_settings_v2";
  var state = {
    langA: "zh-CN", langB: "en-US",
    engine: "mymemory",
    azureKey: "", azureRegion: "",
    azureEndpoint: "https://api.cognitive.microsofttranslator.com",
    speak: true, face: false
  };
  try { Object.assign(state, JSON.parse(localStorage.getItem(LS) || "{}")); } catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  var statusDot = $("statusDot"), statusText = $("statusText");
  function setStatus(msg, kind){ statusText.textContent = msg; statusDot.className = "dot" + (kind?(" "+kind):""); }

  // 语言注册表：code=内部/BCP47, mm=MyMemory langpair 码
  var LANGS = [
    {code:"zh-CN", label:"中文",       mm:"zh-CN"},
    {code:"en-US", label:"English",    mm:"en"},
    {code:"ru-RU", label:"Русский",    mm:"ru"},
    {code:"fr-FR", label:"Français",   mm:"fr"},
    {code:"de-DE", label:"Deutsch",    mm:"de"},
    {code:"ja-JP", label:"日本語",      mm:"ja"},
    {code:"ko-KR", label:"한국어",      mm:"ko"},
    {code:"es-ES", label:"Español",    mm:"es"},
    {code:"it-IT", label:"Italiano",   mm:"it"},
    {code:"pt-BR", label:"Português",  mm:"pt-BR"},
    {code:"th-TH", label:"ไทย",         mm:"th"},
    {code:"vi-VN", label:"Tiếng Việt", mm:"vi"},
    {code:"ar-SA", label:"العربية",    mm:"ar"}
  ];
  var LANGMAP = {}; LANGS.forEach(function(l){ LANGMAP[l.code]=l; });
  // 旧设置里可能残留不在列表的语言，回退到英文
  if(!LANGMAP[state.langA]) state.langA = "en-US";
  if(!LANGMAP[state.langB]) state.langB = "zh-CN";
  function lang(code){ return LANGMAP[code] || {code:code,label:code,mm:(code||"").split("-")[0]}; }
  function labelOf(code){ return lang(code).label; }
  function speechLang(code){ return code; }   // BCP47，用于语音识别
  function ttsLang(code){ return code; }      // 用于语音合成
  function mmLang(code){ return lang(code).mm; } // 用于 MyMemory

  // 把语言列表填充到 <select>
  function fillLangSelect(sel, selected){
    sel.innerHTML = "";
    LANGS.forEach(function(l){
      var o = document.createElement("option");
      o.value = l.code; o.textContent = l.label;
      sel.appendChild(o);
    });
    sel.value = selected;
  }

  // 持久化输入
  function refreshLangs(){
    var sa=$("langSelA"), sb=$("langSelB");
    if(sa.value!==state.langA) sa.value=state.langA;
    if(sb.value!==state.langB) sb.value=state.langB;
    $("srcA").textContent = labelOf(state.langA)+" → "+labelOf(state.langB);
    $("srcB").textContent = labelOf(state.langB)+" → "+labelOf(state.langA);
    $("srcA").classList.add("empty");
    $("srcB").classList.add("empty");
  }

  /* ---------- 翻译 ---------- */
  async function translate(text, from, to){
    if(!text.trim()) return "";
    if(state.engine==="azure" && state.azureKey){
      return await translateAzure(text, from, to);
    }
    return await translateMyMemory(text, from, to);
  }

  async function translateMyMemory(text, from, to){
    var url = "https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+
              "&langpair="+mmLang(from)+"|"+mmLang(to);
    var r = await fetch(url);
    if(!r.ok) throw new Error("HTTP "+r.status);
    var j = await r.json();
    var out = j && j.responseData && j.responseData.translatedText;
    if(!out) throw new Error("无译文");
    // MyMemory 有时返回大写标签，清理
    out = String(out).replace(/<br\/?>/g," ").trim();
    return out;
  }

  // 内部码 → Azure Translator 语种码
  function azCode(code){
    if(code==="zh-CN") return "zh-Hans";
    if(code==="pt-BR") return "pt";
    return (code||"").split("-")[0];
  }
  async function translateAzure(text, from, to){
    var ep = (state.azureEndpoint||"https://api.cognitive.microsofttranslator.com").replace(/\/+$/,"");
    var url = ep + "/translate?api-version=3.0&to=" + encodeURIComponent(azCode(to));
    if(azCode(from)) url += "&from=" + encodeURIComponent(azCode(from));
    var headers = {
      "Ocp-Apim-Subscription-Key": state.azureKey,
      "Content-Type": "application/json"
    };
    if(state.azureRegion) headers["Ocp-Apim-Subscription-Region"] = state.azureRegion;
    var r = await fetch(url, { method:"POST", headers:headers, body: JSON.stringify([{ Text:text }]) });
    if(!r.ok){ var t=await r.text(); throw new Error("HTTP "+r.status+" "+(t||"").slice(0,120)); }
    var j = await r.json();
    var out = j && j[0] && j[0].translations && j[0].translations[0] && j[0].translations[0].text;
    if(!out) throw new Error("无译文");
    return out;
  }

  /* ---------- 语音合成 ---------- */
  var cachedVoices = [];
  var keepaliveTimer = null;
  function loadVoices(){
    if(!("speechSynthesis" in window)) return;
    var vv = window.speechSynthesis.getVoices() || [];
    if(vv.length){ cachedVoices = vv; return; }
    // 列表为空：用一个空语音触发 Chrome 异步加载（随后会派发 onvoiceschanged）
    try{ window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); }catch(e){}
  }
  function pickVoice(prefLang){
    loadVoices();
    var list = cachedVoices;
    var p = (prefLang||"").toLowerCase().replace("_","-");
    var base = p.slice(0,2);
    var norm = function(x){ return (x.lang||"").toLowerCase().replace("_","-"); };
    var isLocal = function(v){ return v.localService; };
    var localFull = list.filter(function(v){return isLocal(v) && norm(v)===p;});
    var localBase = list.filter(function(v){return isLocal(v) && norm(v).indexOf(base)===0;});
    var localAny  = list.filter(isLocal);
    var anyBase   = list.filter(function(v){return norm(v).indexOf(base)===0;});
    // 关键：本地语音优先级 > 匹配语言的云端语音，避免华为网络下云端 Google 语音发不出声
    return localFull[0] || localBase[0] || localAny[0] || anyBase[0] || list[0] || null;
  }
  function clearKeepalive(){ if(keepaliveTimer){ clearInterval(keepaliveTimer); keepaliveTimer=null; } }
  function speak(text, langCode){
    if(!("speechSynthesis" in window)){ setStatus("此浏览器不支持语音合成","warn"); return false; }
    if(!text) return false;
    var synth = window.speechSynthesis;
    // 先解除"卡住/静音"状态：cancel + resume
    clearKeepalive();
    try{ synth.cancel(); }catch(e){}
    try{ synth.resume(); }catch(e){}
    function go(){
      loadVoices();
      if(!cachedVoices.length){ setStatus("正在加载语音列表…请过一秒再点一次 🔊","warn"); return; }
      var v = pickVoice(ttsLang(langCode));
      var u = new SpeechSynthesisUtterance(text);
      if(v){ u.voice = v; u.lang = v.lang || ttsLang(langCode); }
      else { u.lang = ttsLang(langCode); }
      u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
      u.onstart = function(){ setStatus("正在朗读…（"+(u.voice?u.voice.name:"默认")+"）","live"); };
      u.onend   = function(){ clearKeepalive(); setStatus("朗读结束，可点 🔊 重听","ok"); };
      u.onerror = function(e){
        clearKeepalive();
        var err = e && e.error;
        if(err==="interrupted"){ /* 正常被新一轮朗读打断 */ return; }
        if(err==="not-allowed"){ setStatus("浏览器拦截自动发声，请点 🔊 手动朗读","warn"); return; }
        setStatus("朗读出错("+err+")，语音："+(u.voice?u.voice.name:"默认"),"warn");
      };
      try{ synth.speak(u); }catch(err){ setStatus("朗读启动失败："+err.message,"warn"); return; }
      // 续播保护：防 15s 截断，也用于解除 pause 卡死
      clearKeepalive();
      keepaliveTimer = setInterval(function(){
        if(synth.speaking || synth.paused){ try{ synth.resume(); }catch(e){} }
        else { clearKeepalive(); }
      }, 6000);
    }
    // cancel 后隔一帧再开播，规避"取消后首句被吞"
    setTimeout(go, 50);
    return true;
  }

  /* ---------- 语音识别（Web Speech API） ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var srOk = !!SR;
  var recognizing = null; // {side, rec}

  function startRecognize(side, onFinal, onErr, onStart, onEnd){
    if(!srOk){ onErr("此浏览器不支持语音识别（华为无谷歌服务常见）。请改用输入框打字。"); return; }
    var code = side==="A"?state.langA:state.langB;
    var rec = new SR();
    rec.lang = speechLang(code);
    rec.interimResults = true;
    rec.continuous = false;
    var got = false;
    rec.onstart = function(){ onStart && onStart(); };
    rec.onresult = function(ev){
      var interim="", final="";
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        var t=ev.results[i][0].transcript;
        if(ev.results[i].isFinal) final+=t; else interim+=t;
      }
      if(interim && !final){ onFinal(interim, true); }
      if(final){ got=true; onFinal(final, false); }
    };
    rec.onerror = function(ev){ onErr(ev.error==="not-allowed"?"请在浏览器允许麦克风权限":"识别出错("+ev.error+")，可改用文字输入"); };
    rec.onend = function(){ onEnd && onEnd(); if(!got){} };
    try{ rec.start(); recognizing={side:side, rec:rec}; }
    catch(e){ onErr("无法启动录音："+e.message); }
  }
  function stopRecognize(){ if(recognizing){ try{recognizing.rec.stop();}catch(e){} recognizing=null; } }

  /* ---------- 处理一侧的一次发言 ---------- */
  async function handleUtterance(side, sourceText){
    sourceText = (sourceText||"").trim();
    if(!sourceText) return;
    var from = side==="A"?state.langA:state.langB;
    var to   = side==="A"?state.langB:state.langA;
    var srcEl = $(side==="A"?"srcA":"srcB");
    var dstEl = $(side==="A"?"dstA":"dstB");
    var oppDst = $(side==="A"?"dstB":"dstA");
    var oppSrc = $(side==="A"?"srcB":"srcA");

    srcEl.classList.remove("empty"); srcEl.textContent = sourceText;
    dstEl.classList.add("empty"); dstEl.textContent = "翻译中…";
    setStatus("翻译中："+labelOf(from)+" → "+labelOf(to), "live");
    try{
      var out = await translate(sourceText, from, to);
      // 同侧显示译文（自己看得到自己说了什么+译文）
      dstEl.classList.remove("empty"); dstEl.textContent = out;
      // 对方侧大字显示译文
      oppDst.classList.remove("empty"); oppDst.textContent = out;
      // 记录译文语言，供朗读按钮使用
      dstEl.dataset.lang = to; oppDst.dataset.lang = to;
      saveMessage(from, to, sourceText, out);
      if(state.speak) speak(out, to);
      setStatus("已完成，可点 🔊 重听译文", "ok");
    }catch(e){
      dstEl.textContent = "翻译失败："+e.message;
      setStatus("翻译失败，请重试或换引擎", "err");
    }
  }

  function clearOpposite(){ /* 保持上一次显示，简单起见不清 */ }

  /* ---------- 对话记录（SQLite via sql.js + IndexedDB 持久化） ---------- */
  var MAXHIST = 1000;
  var SQL = null, db = null;

  function idbOpen(){
    return new Promise(function(res,rej){
      if(!("indexedDB" in window)) return rej(new Error("此浏览器不支持 IndexedDB"));
      var req = indexedDB.open("talktrans_db", 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore("kv"); };
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(){ rej(req.error); };
    });
  }
  function idbGet(){
    return idbOpen().then(function(d){ return new Promise(function(res,rej){
      var tx=d.transaction("kv").objectStore("kv").get("db");
      tx.onsuccess=function(){ res(tx.result||null); }; tx.onerror=function(){ rej(tx.error); };
    });});
  }
  function idbPut(data){
    return idbOpen().then(function(d){ return new Promise(function(res,rej){
      var tx=d.transaction("kv","readwrite"); tx.objectStore("kv").put(data,"db");
      tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); };
    });});
  }

  async function initDB(){
    try{
      if(typeof window.initSqlJs!=="function"){ setStatus("SQLite 引擎未加载（CDN 不可达），历史记录将不会被保存","warn"); return false; }
      SQL = await window.initSqlJs({ locateFile: function(f){ return "https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/"+f; } });
      var saved = await idbGet();
      db = saved ? new SQL.Database(new Uint8Array(saved)) : new SQL.Database();
      db.run("CREATE TABLE IF NOT EXISTS messages(id INTEGER PRIMARY KEY AUTOINCREMENT, ts INTEGER, from_code TEXT, to_code TEXT, source TEXT, translation TEXT);");
      return true;
    }catch(e){ db=null; setStatus("SQLite 初始化失败："+e.message,"warn"); return false; }
  }

  function saveMessage(fromCode, toCode, src, tr){
    if(!db) return;
    try{
      db.run("INSERT INTO messages(ts,from_code,to_code,source,translation) VALUES(?,?,?,?,?);", [Date.now(), fromCode, toCode, src, tr]);
      db.run("DELETE FROM messages WHERE id NOT IN (SELECT id FROM messages ORDER BY ts DESC, id DESC LIMIT "+MAXHIST+");");
      var data = db.export();
      idbPut(data).catch(function(){});
      renderHistory();
    }catch(e){ setStatus("保存记录失败："+e.message,"warn"); }
  }

  function clearMessages(){
    if(!db){ $("log").innerHTML=""; return; }
    try{ db.run("DELETE FROM messages;"); }catch(e){}
    try{ db.run("DELETE FROM sqlite_sequence WHERE name='messages';"); }catch(e){}
    idbPut(db.export()).catch(function(){});
    renderHistory();
  }

  var lastCount = 0, shownCount = 0;
  var filterText = "", filterPair = "";

  function getTotalCount(){
    if(!db) return 0;
    try{ var r=db.exec("SELECT COUNT(*) FROM messages;"); return (r&&r[0]&&r[0].values&&r[0].values[0])?r[0].values[0][0]:0; }catch(e){ return 0; }
  }
  // 依据库中实际出现过的语言对，重建筛选下拉，并尽量保留当前选择
  function refreshPairOptions(){
    var sel = $("pairFilter"); if(!sel) return;
    var pairs = [];
    if(db){ try{ var o=db.exec("SELECT DISTINCT from_code,to_code FROM messages ORDER BY from_code,to_code;"); pairs=(o&&o[0]&&o[0].values)?o[0].values:[]; }catch(e){} }
    sel.innerHTML="";
    var o0=document.createElement("option"); o0.value=""; o0.textContent="全部语言对"; sel.appendChild(o0);
    pairs.forEach(function(p){ var o=document.createElement("option"); o.value=p[0]+"|"+p[1]; o.textContent=labelOf(p[0])+" → "+labelOf(p[1]); sel.appendChild(o); });
    var exists=false; for(var i=0;i<sel.options.length;i++){ if(sel.options[i].value===filterPair){ exists=true; break; } }
    if(!exists) filterPair="";
    sel.value=filterPair;
  }
  function updateHistoryLabel(){
    var open = $("log").classList.contains("open");
    var filtering = filterText || filterPair;
    var base = filtering
      ? "对话记录（显示 "+shownCount+" / 共 "+lastCount+" · 最多"+MAXHIST+"）"
      : "对话记录（"+lastCount+" 条 · 最多"+MAXHIST+"）";
    $("logToggle").textContent = (open?"▾":"▸")+" "+base;
  }

  function downloadBlob(content, mime, filename){
    try{
      var blob=new Blob([content],{type:mime});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1000);
      return true;
    }catch(e){ setStatus("下载失败："+e.message,"warn"); return false; }
  }
  function stamp(){ return new Date().toISOString().slice(0,19).replace(/[:T]/g,"-"); }

  function makeReadBtn(text, langCode, title){
    var rb=document.createElement("button"); rb.type="button"; rb.className="rowread"; rb.textContent="🔊";
    rb.title=title; rb.dataset.lang=langCode; rb.dataset.text=text;
    return rb;
  }

  function renderHistory(){
    var log = $("log");
    if(!db){ lastCount=0; shownCount=0; refreshPairOptions(); updateHistoryLabel(); log.innerHTML = '<div class="row"><div class="who">历史记录不可用（未加载 SQLite）</div></div>'; return; }
    var total = getTotalCount();
    var out=[];
    try{ out = db.exec("SELECT id,ts,from_code,to_code,source,translation FROM messages ORDER BY ts DESC, id DESC LIMIT "+MAXHIST+";"); }catch(e){}
    var all = (out.length && out[0] && out[0].values) ? out[0].values : [];
    refreshPairOptions();
    var ftxt = filterText.toLowerCase();
    var rows = all.filter(function(v){
      if(filterPair && (v[2]+"|"+v[3])!==filterPair) return false;
      if(ftxt){ var s=(v[4]||"").toLowerCase(), t=(v[5]||"").toLowerCase(); if(s.indexOf(ftxt)<0 && t.indexOf(ftxt)<0) return false; }
      return true;
    });
    lastCount = total; shownCount = rows.length;
    log.innerHTML="";
    if(!rows.length){
      updateHistoryLabel();
      var empty=document.createElement("div"); empty.className="row";
      var ew=document.createElement("div"); ew.className="who";
      ew.textContent = (total>0) ? "无匹配记录" : "暂无对话记录";
      empty.appendChild(ew); log.appendChild(empty); return;
    }
    rows.forEach(function(v){
      var id=v[0], ts=v[1], fc=v[2], tc=v[3], src=v[4], tr=v[5];
      var row=document.createElement("div"); row.className="row"; row.dataset.id=id;
      var head=document.createElement("div"); head.className="rowhead";
      var who=document.createElement("div"); who.className="who"; who.textContent=labelOf(fc)+" → "+labelOf(tc)+" · "+new Date(ts).toLocaleString();
      var del=document.createElement("button"); del.type="button"; del.className="rowdel"; del.textContent="✕ 删除"; del.title="删除这条记录"; del.dataset.id=id;
      head.appendChild(who); head.appendChild(del);
      var t=document.createElement("div"); t.className="t"; t.textContent=src+" "; t.appendChild(makeReadBtn(src, fc, "朗读原文"));
      var tre=document.createElement("div"); tre.className="tr"; tre.textContent=tr+" "; tre.appendChild(makeReadBtn(tr, tc, "朗读译文"));
      row.appendChild(head); row.appendChild(t); row.appendChild(tre);
      log.appendChild(row);
    });
    updateHistoryLabel();
  }

  function deleteMessage(id){
    if(!db) return;
    try{ db.run("DELETE FROM messages WHERE id=?;", [id]); idbPut(db.export()).catch(function(){}); renderHistory(); }
    catch(e){ setStatus("删除失败："+e.message,"warn"); }
  }

  function exportHistory(){
    if(!db){ setStatus("历史不可用，无法导出","warn"); return; }
    var out=[];
    try{ out = db.exec("SELECT ts,from_code,to_code,source,translation FROM messages ORDER BY ts ASC, id ASC;"); }catch(e){}
    var rows = (out.length && out[0].values) ? out[0].values : [];
    if(!rows.length){ setStatus("没有记录可导出","warn"); return; }
    var lines = ["对话翻译记录导出  "+new Date().toLocaleString(), "共 "+rows.length+" 条", ""];
    rows.forEach(function(v){
      var ts=v[0],fc=v[1],tc=v[2],src=v[3],tr=v[4];
      lines.push("["+new Date(ts).toLocaleString()+"] "+labelOf(fc)+" → "+labelOf(tc));
      lines.push("  原文: "+src);
      lines.push("  译文: "+tr);
      lines.push("");
    });
    var text = lines.join("\n");
    if(downloadBlob(text,"text/plain;charset=utf-8","translate-history-"+stamp()+".txt")) setStatus("已导出 "+rows.length+" 条记录","ok");
  }

  function csvCell(x){ x=(x==null?"":String(x)); return /[",\r\n]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x; }
  function exportCsv(){
    if(!db){ setStatus("历史不可用，无法导出","warn"); return; }
    var out=[];
    try{ out = db.exec("SELECT ts,from_code,to_code,source,translation FROM messages ORDER BY ts ASC, id ASC;"); }catch(e){}
    var rows = (out.length && out[0] && out[0].values) ? out[0].values : [];
    if(!rows.length){ setStatus("没有记录可导出","warn"); return; }
    var lines = ["timestamp,datetime,from,to,source,translation"];
    rows.forEach(function(v){
      lines.push([v[0], csvCell(new Date(v[0]).toLocaleString()), csvCell(v[1]), csvCell(v[2]), csvCell(v[3]), csvCell(v[4])].join(","));
    });
    if(downloadBlob(lines.join("\r\n"),"text/csv;charset=utf-8","translate-history-"+stamp()+".csv")) setStatus("已导出 CSV："+rows.length+" 条","ok");
  }

  // 解析 CSV（支持引号、转义双引号、CRLF）
  function parseCsv(text){
    text = String(text||"").replace(/^\uFEFF/,"");
    var rows=[], row=[], field="", i=0, n=text.length, inQ=false;
    while(i<n){
      var c=text[i];
      if(inQ){
        if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; }
        field+=c; i++; continue;
      } else {
        if(c==='"'){ inQ=true; i++; continue; }
        if(c===','){ row.push(field); field=""; i++; continue; }
        if(c==='\r'){ i++; continue; }
        if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
        field+=c; i++; continue;
      }
    }
    if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
    return rows;
  }

  // 导入 CSV/TXT（按列 timestamp,from,to,source,translation；自动跳过表头）
  function importCsv(text, name){
    if(!db){ setStatus("历史不可用，无法导入","warn"); return; }
    var rows = parseCsv(text);
    if(!rows.length){ setStatus("文件为空","warn"); return; }
    var start = (isNaN(parseInt(rows[0][0],10)) ? 1 : 0);
    var added = 0;
    for(var r=start; r<rows.length; r++){
      var v = rows[r]; if(!v || v.length<5) continue;
      var ts = parseInt(v[0],10); if(isNaN(ts)) ts = Date.now();
      var fc = (v[2]||"").trim(), tc = (v[3]||"").trim(), src = v[4]||"", tr = v[5]||"";
      if(!fc && !tc && !src && !tr) continue;
      db.run("INSERT INTO messages(ts,from_code,to_code,source,translation) VALUES(?,?,?,?,?);", [ts,fc,tc,src,tr]);
      added++;
    }
    db.run("DELETE FROM messages WHERE id NOT IN (SELECT id FROM messages ORDER BY ts DESC, id DESC LIMIT "+MAXHIST+");");
    idbPut(db.export()).catch(function(){});
    renderHistory();
    setStatus(added?("已导入 "+added+" 条（来自 "+name+"）"):"没有可导入的记录","ok");
  }

  // 历史区点击委托：朗读(原文/译文) 与 删除单条
  $("log").addEventListener("click", function(e){
    var t=e.target; if(!t || !t.closest) return;
    var rb=t.closest(".rowread");
    if(rb){ var txt=(rb.dataset.text||"").trim(); if(!txt){setStatus("这段没有可朗读内容","warn");return;} rb.classList.add("playing"); setTimeout(function(){rb.classList.remove("playing");},450); speak(txt, rb.dataset.lang || state.langB); return; }
    var del=t.closest(".rowdel");
    if(del){ var id=parseInt(del.dataset.id,10); if(!isNaN(id)){ deleteMessage(id); setStatus("已删除 1 条记录","ok"); } }
  });

  /* ---------- 绑定 UI ---------- */
  function bindMic(btnId, side){
    var btn = $(btnId);
    var input = $(side==="A"?"inA":"inB");
    // 点击开始/停止（比按住更稳）
    var active = false;
    btn.addEventListener("click", function(){
      if(active){ stopRecognize(); return; }
      if(!srOk){ input.focus(); setStatus("不支持语音识别：请点输入框打字后按“译”", "warn"); return; }
      active = true; btn.classList.add("recording");
      var dstEl = $(side==="A"?"dstA":"dstB");
      var srcEl = $(side==="A"?"srcA":"srcB");
      startRecognize(side,
        function(text, interim){ srcEl.classList.remove("empty"); srcEl.textContent = text; },
        function(err){ setStatus(err,"err"); },
        function(){ setStatus("正在聆听 "+labelOf(side==="A"?state.langA:state.langB)+" …","live"); },
        function(){ active=false; btn.classList.remove("recording"); }
      );
      // 识别结束触发翻译：onend 后由 onFinal 已填好 srcEl，这里加一个停止时翻译
      var stopAndTranslate = function(){
        if(srcEl.textContent && !srcEl.classList.contains("empty")){
          var s = srcEl.textContent;
          handleUtterance(side, s);
        }
      };
      // 监听 rec.end
      var check = setInterval(function(){
        if(!active){ clearInterval(check); stopAndTranslate(); }
      }, 250);
    });
  }
  bindMic("micA","A");
  bindMic("micB","B");

  function bindRead(btnId, dstId){
    var btn=$(btnId), dst=$(dstId);
    btn.addEventListener("click", function(){
      var txt=(dst.textContent||"").trim();
      if(dst.classList.contains("empty") || !txt || txt==="翻译中…" || txt.indexOf("译文将显示")>=0){
        setStatus("先翻译，再点 🔊 朗读","warn"); return;
      }
      btn.classList.add("playing"); setTimeout(function(){btn.classList.remove("playing");},450);
      speak(txt, dst.dataset.lang || state.langB);
    });
  }
  bindRead("readA","dstA");
  bindRead("readB","dstB");

  document.querySelectorAll(".btn.send").forEach(function(b){
    var side = b.getAttribute("data-send");
    var input = $(side==="A"?"inA":"inB");
    b.addEventListener("click", function(){ handleUtterance(side, input.value); input.value=""; });
    input.addEventListener("keydown", function(e){ if(e.key==="Enter"){ handleUtterance(side, input.value); input.value=""; } });
  });

  function swapLangs(){ var t=state.langA; state.langA=state.langB; state.langB=t; refreshLangs(); saveState(); }
  $("swapAB").addEventListener("click", swapLangs);

  function saveState(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }

  // 语言选择框
  fillLangSelect($("langSelA"), state.langA);
  fillLangSelect($("langSelB"), state.langB);
  $("langSelA").addEventListener("change", function(){ state.langA=this.value; if(state.langA===state.langB){ /* 允许相同，提示无意义 */ } refreshLangs(); saveState(); });
  $("langSelB").addEventListener("change", function(){ state.langB=this.value; refreshLangs(); saveState(); });

  // 面对面模式
  $("faceBtn").addEventListener("click", function(){
    document.body.classList.toggle("face");
    state.face = document.body.classList.contains("face");
    $("faceBtn").style.background = state.face ? "var(--a)" : "var(--chip)";
  });

  // 记录展开/收起（条数显示，同时显示/隐藏筛选栏）
  $("logToggle").addEventListener("click", function(){
    var open = $("log").classList.toggle("open");
    $("logFilter").classList.toggle("open", open);
    updateHistoryLabel();
  });
  // 导出 TXT
  $("exportBtn").addEventListener("click", exportHistory);
  // 导出 CSV
  $("exportCsvBtn").addEventListener("click", exportCsv);
  // 导入 CSV（触发隐藏文件选择框）
  $("importBtn").addEventListener("click", function(){ $("importFile").value=""; $("importFile").click(); });
  $("importFile").addEventListener("change", function(){
    var f=this.files && this.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){ importCsv(String(rd.result||""), f.name); };
    rd.onerror=function(){ setStatus("读取文件失败","warn"); };
    rd.readAsText(f,"utf-8");
  });
  // 搜索 / 语言对筛选
  $("searchBox").addEventListener("input", function(){ filterText=this.value; renderHistory(); });
  $("pairFilter").addEventListener("change", function(){ filterPair=this.value; renderHistory(); });
  $("clearFilterBtn").addEventListener("click", function(){
    filterText=""; filterPair=""; $("searchBox").value=""; $("pairFilter").value=""; renderHistory();
  });

  /* ---------- 设置面板 ---------- */
  var modal = $("settings");
  function openSettings(){
    $("setEngine").value=state.engine; $("setAzureKey").value=state.azureKey;
    $("setAzureRegion").value=state.azureRegion; $("setAzureEndpoint").value=state.azureEndpoint;
    $("setSpeak").value=state.speak?"on":"off";
    $("azureFields").style.display = state.engine==="azure"?"block":"none";
    modal.classList.add("open");
  }
  $("settingsBtn").addEventListener("click", openSettings);
  $("settingsClose").addEventListener("click", function(){ modal.classList.remove("open"); });
  modal.addEventListener("click", function(e){ if(e.target===modal) modal.classList.remove("open"); });
  $("setEngine").addEventListener("change", function(){ $("azureFields").style.display = this.value==="azure"?"block":"none"; });
  $("saveSettings").addEventListener("click", function(){
    state.engine=$("setEngine").value; state.azureKey=$("setAzureKey").value.trim();
    state.azureRegion=$("setAzureRegion").value.trim();
    state.azureEndpoint=$("setAzureEndpoint").value.trim() || "https://api.cognitive.microsofttranslator.com";
    state.speak=$("setSpeak").value==="on";
    try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
    refreshLangs(); modal.classList.remove("open"); setStatus("设置已保存","ok");
  });
  $("clearLog").addEventListener("click", function(){ clearMessages(); setStatus("已清空对话记录","ok"); });

  // 预加载语音：列表常异步到达，监听 onvoiceschanged 并在首次触摸时再取一次
  if("speechSynthesis" in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
    var once=function(){ loadVoices(); window.removeEventListener("pointerdown",once); };
    window.addEventListener("pointerdown", once);
  }

  // 初始化：异步加载 SQLite 后渲染历史
  $("verTag").textContent = APP_VERSION;
  refreshLangs();
  (async function boot(){
    var ok = await initDB();
    renderHistory();
    if(!srOk){
      setStatus(ok?"就绪：说话或输入翻译（历史已启用本地SQLite）":"历史不可用（CDN），仍可翻译/朗读","warn");
    }else{
      setStatus(ok?"准备就绪：点麦克风说话，或直接输入文字":"准备就绪（历史持久化不可用）","ok");
    }
  })();
})();
</script>
